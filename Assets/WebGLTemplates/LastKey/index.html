<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAST KEY</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080e15;color:#e4edf1;font-family:Arial,sans-serif}
#unity-container{position:absolute;inset:0;display:grid;place-items:center}
#unity-fullscreen-container{position:relative;width:min(100vw,calc(100vh * 16 / 9));aspect-ratio:16/9;background:#080e15}
#unity-canvas{width:100%;height:100%;display:block;outline:none}
#loader{position:absolute;inset:0;display:grid;place-content:center;gap:22px;background:#080e15;text-align:center}
h1{font-size:clamp(32px,5vw,80px);font-weight:400;letter-spacing:.15em;margin:0}p{color:#70cbd0;margin:0;font-size:clamp(14px,1.4vw,23px)}
#track{height:5px;background:#192e38;width:min(65vw,540px);margin:15px auto}#progress{height:100%;width:0;background:#3ed2cf}
#start-audio{display:none;background:#12616b;border:1px solid #51d5ce;color:white;padding:18px 30px;font:18px Arial;cursor:pointer}
#error{color:#ff737b;max-width:680px;font-size:18px}
</style></head><body><div id="unity-container"><div id="unity-fullscreen-container"><canvas id="unity-canvas" width="1920" height="1080" tabindex="0" aria-label="LAST KEY: competencia de mecanografía"></canvas><div id="loader"><h1>LAST KEY</h1><p>PREPARANDO LA COMPETENCIA</p><div id="track"><div id="progress"></div></div><button id="start-audio">COMENZAR CON SONIDO</button><p id="error"></p></div></div></div>
<script>
const canvas=document.querySelector('#unity-canvas');
const script=document.createElement('script');script.src='Build/{{{ LOADER_FILENAME }}}?v=42neck';
script.onload=()=>createUnityInstance(canvas,{dataUrl:'Build/{{{ DATA_FILENAME }}}?v=42neck',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}?v=42neck',codeUrl:'Build/{{{ CODE_FILENAME }}}?v=42neck',streamingAssetsUrl:'StreamingAssets',companyName:'LAST KEY',productName:'LAST KEY',productVersion:'4.2',autoSyncPersistentDataPath:true,devicePixelRatio:Math.min(window.devicePixelRatio||1,2)},p=>document.querySelector('#progress').style.width=(p*100)+'%').then(instance=>{window.addEventListener('pagehide',()=>{instance.SendMessage('Systems','StopSessionAudio');instance.Quit();},{once:true});document.querySelector('#track').style.display='none';document.querySelector('#loader p').textContent='LA COMPETENCIA ESTÁ LISTA';const start=document.querySelector('#start-audio');start.style.display='block';start.onclick=()=>{instance.SendMessage('Systems','EnableBrowserAudio');if(new URLSearchParams(location.search).get('visual')==='1')instance.SendMessage('Systems','BeginVisualPreview');document.querySelector('#loader').style.display='none';canvas.focus();};}).catch(error=>{document.querySelector('#error').textContent='No se pudo cargar la competencia: '+error;});
document.body.appendChild(script);
</script></body></html>
